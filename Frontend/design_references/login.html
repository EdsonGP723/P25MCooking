<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>The Botanical Atelier - Login</title>

                        "on-secondary-container": "#5d655a",
                        "surface-container-high": "#e6e9e7",
                        "on-background": "#191c1b",
                        "surface-variant": "#e1e3e1",

<style>.material-symbols-outlined {
    font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24
    }
.bg-gradient-primary {
    background-image: linear-gradient(135deg, #3f665c 0%, #80a89d 100%)
    }
.bg-botanical-blur {
    background-image: url(https://lh3.googleusercontent.com/aida-public/AB6AXuCaFfhDa2N_xIOrnCJ_gA27wJChmHMqH8faP6gJJrtjfhuk6Smr7C2kUgXqtwnfWvUnaI_yX6Xgo_rvWku1qJAAMJgXQ3CM6HH5hvwxDOrZunqsdeZ0lSF6h83xDN-36ro4CdCmodJxYNTi3JTWsSgHt3V6rd58kivpoH6EZDZr34462orThCNBn4ayDNtJoAD8hXcGmnK5q_wMt_dfIIoXknEHoG2C7VTkNmhv1ybWxYARpSTphcgwZB2IhDOkycwDCzx1_AQnXfHj);
    background-size: cover;
    background-position: center

<body class="font-body bg-background text-on-surface min-h-screen flex flex-col antialiased">
<!-- Main Content Area -->
<main class="flex-grow flex items-center justify-center relative w-full h-full min-h-screen">
<!-- Background Image with Blur -->
<div class="absolute inset-0 z-0 bg-botanical-blur opacity-80" data-alt="Soft, slightly blurred background of lush green botanical leaves, conveying a serene and organic atmosphere." style="filter: blur(8px) brightness(0.9);"></div>
<!-- Tonal Overlay for readabilty -->
<div class="absolute inset-0 z-0 bg-surface/40"></div>
<!-- Login Card Container -->
<div class="relative z-10 w-full max-w-md px-6 py-12 md:px-12 md:py-16 bg-surface-container-lowest/90 backdrop-blur-2xl rounded-xl shadow-[0_20px_40px_rgba(25,28,27,0.06)] border border-outline-variant/20 flex flex-col gap-8">
<!-- Header -->
<div class="text-center space-y-2">
<h1 class="font-headline text-3xl md:text-4xl text-on-surface tracking-tight">Welcome back, Muse</h1>
<p class="font-body text-sm text-on-surface-variant">Sign in to access your digital heirloom.</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-6 w-full">
<!-- Email Input -->
<div class="flex flex-col gap-2">
<label class="font-label text-xs tracking-wide text-on-surface font-medium ml-1" for="email">Email</label>
<div class="relative">
<span class="absolute inset-y-0 left-4 flex items-center text-outline pointer-events-none material-symbols-outlined text-xl">mail</span>
<input class="w-full pl-12 pr-4 py-4 bg-surface-container-low rounded-lg border border-outline-variant/20 text-on-surface font-body text-sm focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-colors placeholder:text-outline-variant" id="email" name="email" placeholder="your@email.com" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center ml-1 mr-1">
<label class="font-label text-xs tracking-wide text-on-surface font-medium" for="password">Password</label>
<a class="font-label text-xs text-primary hover:text-primary-container transition-colors underline underline-offset-2" href="#">Forgot Password?</a>
</div>
<div class="relative">
<span class="absolute inset-y-0 left-4 flex items-center text-outline pointer-events-none material-symbols-outlined text-xl">lock</span>
<input class="w-full pl-12 pr-4 py-4 bg-surface-container-low rounded-lg border border-outline-variant/20 text-on-surface font-body text-sm focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-colors placeholder:text-outline-variant" id="password" name="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Actions -->
<div class="pt-4 flex flex-col gap-4">
<button class="w-full py-4 px-6 rounded-full bg-gradient-primary text-on-primary font-body text-sm font-semibold hover:opacity-90 transition-opacity flex items-center justify-center gap-2" type="button">
                        Sign In
                        <span class="material-symbols-outlined text-lg">arrow_forward</span>
</button>
</div>
</form>
</div>
</main>
</body></html>
